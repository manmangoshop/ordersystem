<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 分頁 Logo (Favicon) -->
    <link rel="icon" type="image/png" href="https://github.com/manmangoshop/photo/blob/main/Webpage-Logo4.png?raw=true">
    <title>満満菓 Manmango Shop｜日本精選伴手禮/禮盒</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;500;700&family=Noto+Serif+TC:wght=600;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --shadow-blue: #7494A1;   
            --wagashi-light: #E8B4BC;
            --gold: #F6BD60;          
            --paper-white: #F9F8F6;   
            --sumi-black: #1A1A1A;    
            --line-green: #06C755;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--paper-white);
            color: var(--sumi-black);
            padding-bottom: 140px; /* 為底部工具欄騰出空間 */
            scroll-behavior: smooth;
        }

        .font-serif { font-family: 'Noto Serif TC', serif; }
        .text-wagashi { color: var(--shadow-blue); }
        .bg-wagashi { background-color: var(--shadow-blue); }
        
        /* 輕量化置頂導覽列 */
        .sticky-navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
        }

        .brand-image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f3f4f6; 
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .img-loading::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            z-index: 1;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .brand-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; 
            transition: opacity 0.6s ease-out;
            z-index: 2;
        }

        .brand-image-container img.loaded { opacity: 1; }

        .recommend-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--shadow-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(197, 129, 143, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.05em;
        }

        .btn-qty { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; }
        .btn-qty:active { transform: scale(0.8); }

        .modal { transition: opacity 0.3s ease-in-out; }
        .modal-content { transform: translateY(20px); transition: transform 0.3s ease-out; }
        .modal.active .modal-content { transform: translateY(0); }
        
        .bg-line { background-color: var(--line-green); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .stock-label {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background-color: #f3f4f6;
            color: #6b7280;
            font-weight: 600;
        }
        
        .stock-none {
            background-color: #fee2e2;
            color: #ef4444;
        }

        /* ====== 【HEADER 輪播圖 專用樣式 (方案 B)】 ====== */
        .carousel-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 10;
        }
        .carousel-slide.active {
            opacity: 1;
            z-index: 20;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            border: none;
            outline: none;
        }
        .dot.active {
            background-color: #ffffff;
            transform: scale(1.25);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        /* 商品項目小圖容器 */
        .item-thumb-box {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #f3f4f6;
            border: 1px solid #f1f1f1;
            cursor: pointer;
            position: relative;
        }
        .item-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .item-thumb-box:hover img {
            transform: scale(1.08);
        }

        /* ====== 【方案二：極簡感隱形輸入框 & 隱藏 HTML5 上下微調箭頭】 ====== */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body id="top">

    <!-- 頂部品牌 Header (Logo 放置左上角) -->
    <nav class="sticky-navbar px-4 py-3 border-b border-gray-100">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://github.com/manmangoshop/photo/blob/main/Headlogo.png?raw=true" 
                     alt="Logo" 
                     class="h-10 w-auto">
                <div class="h-5 w-[1px] bg-gray-200"></div>
                <span class="text-sm font-black font-serif tracking-widest text-gray-800"></span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Selection Shop</span>
                <span class="text-[10px] font-bold text-wagashi leading-none">Japanese Gift Box</span>
            </div>
        </div>
    </nav>

    <!-- ====== 【HEADER 輪播圖 區塊 (方案 B)】 ====== -->
    <header class="relative w-full overflow-hidden aspect-[3/2] md:max-h-[500px] bg-gray-100 shadow-md">
        <!-- 輪播軌道容器 -->
        <div id="header-carousel-track" class="relative w-full h-full cursor-grab active:cursor-grabbing">
            <!-- 幻燈片將由 JavaScript 動態生成並注入此處 -->
        </div>
        
        <!-- 和風浮雕紋理覆蓋層 (Sayagata Pattern) -->
        <div class="absolute inset-0 opacity-[0.06] pointer-events-none z-20" style="background-image: url('https://www.transparenttextures.com/patterns/japanese-sayagata.png');"></div>
        
        <!-- 下方黑底漸層 -->
        <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-black/40 to-transparent pointer-events-none z-20"></div>

        <!-- 導覽指示點 (Dots) -->
        <div id="header-carousel-dots" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2.5 z-30">
            <!-- 指示點將由 JavaScript 動態生成並注入此處 -->
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <!-- 狀態顯示區 -->
        <div id="loading-spinner" class="text-center py-10 text-gray-400 font-bold">
            🎁 正在讀取商品清單...
        </div>
        
        <div id="system-closed-message" class="hidden">
            🎁 訂單系統維護中 🎁<br>
            <span class="text-sm font-normal mt-2 block text-gray-500">感謝您的熱情支持，我們下次見！<br>如有訂單查詢請聯繫 LINE 客服。</span>
        </div>

        <div id="error-message" class="hidden text-center py-10">
            <p class="text-red-400 font-bold mb-4">⚠️ 網路連線不穩，無法讀取庫存</p>
            <button onclick="location.reload()" class="bg-white px-4 py-2 rounded-full shadow-sm text-sm mt-4 border border-red-200">點此重新整理</button>
        </div>

        <div id="product-container" class="grid grid-cols-1 gap-8 hidden">
            <!-- JS 渲染點 -->
        </div>

        <!-- 訂購表單 -->
        <div id="form-section" class="mt-20 pt-10 border-t-2 border-dotted border-gray-300 hidden text-left">
            <h2 class="text-2xl font-serif font-bold text-center mb-10 flex items-center justify-center">
                <span class="text-gold text-xl mr-3">✦</span> 訂購資料登記 <span class="text-gold text-xl ml-3">✦</span>
            </h2>

            <form id="order-form-el" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-6">
                <!-- 第一排：訂購人姓名與手機 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">訂購姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="name" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="您的稱呼">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">聯絡電話 <span class="text-red-500">*</span></label>
                        <input type="tel" id="phone" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="09xxxxxxxx">
                    </div>
                </div>

                <!-- 聯絡收件人整合：雙向即時連動 (新增收件電話) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">收件姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="recipientName" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="收件人稱呼">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">收件電話 <span class="text-red-500">*</span></label>
                        <input type="tel" id="recipientPhone" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="收件人電話">
                    </div>
                    <div class="flex items-end pb-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="same-as-orderer" class="w-4 h-4 accent-[#B02A2A]">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-wagashi transition-colors font-bold">同訂購人資料</span>
                        </label>
                    </div>
                </div>

                <!-- 第三排：LINE 與 Email -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">LINE 名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="line" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="方便聯繫對帳">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">電子郵件 <span class="text-red-500">*</span></label>
                        <input type="email" id="email" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="接受訂單確認信">
                    </div>
                </div>

                <!-- 第四排：配送與備註 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">配送方式 <span class="text-red-500">*</span></label>
                        <select id="shippingMethod" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent appearance-none">
                            <option value="" disabled selected>請選擇配送方式</option>
                            <option value="超商取貨">超商取貨 ($60 / 滿$1500免運)</option>
                            <option value="宅配到府">宅配到府 ($210 / 滿$3000免運)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">備註 / 優惠碼</label>
                        <input type="text" id="note" class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="若有特殊需求請註記">
                    </div>
                </div>

                <!-- 第五排：完整地址 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">收件地址 / 超商門市與店號 <span class="text-red-500">*</span></label>
                    <input type="text" id="address" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-wagashi bg-transparent" placeholder="請填寫完整地址或超商店名">
                </div>

                <!-- 稅務與條款 -->
                <div class="space-y-4 pt-2">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="tax-toggle" class="w-4 h-4 accent-[#B02A2A]">
                        <label for="tax-toggle" class="text-sm font-medium text-gray-700 cursor-pointer">需要開立統一編號 (+5% 稅金)</label>
                    </div>
                    <div id="tax-input-group" class="hidden pl-7">
                        <label class="block text-xs font-bold text-gray-500 mb-1">統一編號</label>
                        <input type="text" id="taxId" maxlength="8" class="w-full border-b border-gray-300 py-1 focus:outline-none focus:border-wagashi bg-transparent" placeholder="請輸入 8 位數統編">
                    </div>
                    
                    <div class="flex items-start gap-3 bg-red-50/50 p-4 rounded-2xl border border-red-100">
                        <input type="checkbox" id="terms-toggle" class="w-4 h-4 mt-1 accent-[#B02A2A]">
                        <label for="terms-toggle" class="text-[11px] text-gray-500 leading-relaxed cursor-pointer">
                            我已閱讀並同意 <span class="text-wagashi font-bold">訂購須知與個資聲明</span>：本活動為代購性質，商品賞味期限依實際到貨為準。本人同意提供以上個人資料僅供本次配送與帳務對接使用。
                        </label>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- 底部資訊欄 (含整合式進度條) -->
    <div id="footer-bar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 z-40 shadow-[0_-8px_25px_rgba(0,0,0,0.08)]">
        
        <!-- 免運進度條 -->
        <div class="w-full px-6 py-2 bg-gray-50/50 border-b border-gray-100">
            <div class="max-w-2xl mx-auto">
                <div class="flex justify-between text-[10px] font-black mb-1">
                    <span id="shipping-msg" class="text-gray-400">正在計算免運進度...</span>
                    <span class="text-wagashi" id="shipping-target">滿 $3,000 宅配免運</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-[3px] overflow-hidden">
                    <div id="progress-bar" class="bg-wagashi h-full transition-all duration-1000 ease-out shadow-[0_0_8px_rgba(197,129,143,0.5)]" style="width: 0%"></div>
                </div>
            </div>
        </div>

         <!-- 金額與按鈕 -->
        <div class="max-w-2xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex flex-col">
                <span id="discount-hint" class="text-[10px] text-green-600 font-bold h-4"></span>
                <div class="flex items-baseline gap-1 text-left">
                    <span class="text-[10px] text-gray-400 font-black uppercase">TOTAL</span>
                    <span class="text-2xl font-black text-wagashi font-serif leading-none">NT$ <span id="footer-total">0</span></span>
                </div>
            </div>
            <button id="pre-submit-btn" class="bg-wagashi text-white px-10 py-3.5 rounded-full font-black shadow-lg shadow-red-900/10 active:scale-95 transition-all tracking-widest text-sm">
                確認預購
            </button>
        </div>
    </div>

    <!-- ==================== 【FAST SCROLL NAVIGATION (雙向懸浮導覽按鈕)】 ==================== -->
    <div id="floating-nav" class="fixed right-4 bottom-32 md:right-6 md:bottom-32 flex flex-col gap-3 z-50 transition-all duration-300 pointer-events-none opacity-0">
        <!-- 回頂部按鈕 (⌃) -->
        <button id="btn-scroll-top" onclick="scrollToId('top')" class="pointer-events-auto flex items-center justify-center w-11 h-11 bg-white hover:bg-gray-50 border border-gray-200/50 text-gray-500 rounded-full shadow-lg transition-all active:scale-95 group" aria-label="回到最上面">
            <svg class="w-5 h-5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"></path></svg>
        </button>
        <!-- 前往填表按鈕 (✍️ 填寫資料) -->
        <button id="btn-scroll-form" onclick="scrollToId('form-section')" class="pointer-events-auto flex items-center gap-1.5 px-3.5 py-3.5 bg-wagashi hover:brightness-105 text-white rounded-full shadow-lg transition-all duration-300 active:scale-95 transform origin-right" aria-label="前往登記表單">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"></path></svg>
            <span class="text-xs font-black tracking-wider leading-none select-none">填寫資料</span>
        </button>
    </div>

    <!-- Modal 彈窗 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 modal opacity-0 pointer-events-none text-left">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden modal-content flex flex-col max-h-[90vh]">
            <div id="modal-header" class="bg-wagashi text-white py-4 px-6 text-center relative flex-shrink-0">
                <h3 id="modal-title" class="font-serif font-bold tracking-widest text-lg text-white">核對訂單內容</h3>
                <button id="close-modal" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-colors">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto grow no-scrollbar bg-white"></div>
            <div id="modal-footer-btns" class="p-4 border-t border-gray-100 bg-gray-50 flex gap-3 flex-shrink-0">
                <!-- 修改內容按鈕 -->
                <button id="back-edit-btn" class="flex-1 py-3 text-sm font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition-all">修改內容</button>
                <!-- 確認送出按鈕 -->
                <button id="confirm-submit-btn" class="flex-1 py-3 text-sm font-bold bg-wagashi text-white rounded-xl shadow-md hover:brightness-110 transition-all text-white">確認送出</button>
            </div>
        </div>
    </div>

    <!-- 智慧商品樣式圖片大圖 Lightbox 彈窗 -->
    <div id="lightbox-overlay" class="fixed inset-0 bg-black/90 z-[70] hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none" onclick="hideLightbox()">
        <button class="absolute right-6 top-6 text-white/60 hover:text-white text-2xl font-bold transition-colors" onclick="hideLightbox()">✕</button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] rounded-xl object-contain shadow-2xl transition-transform duration-300 scale-95" onclick="event.stopPropagation()">
    </div>

    <!-- Warning Modal -->
    <div id="warning-overlay" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-6 modal opacity-0 pointer-events-none text-left">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-xl overflow-hidden modal-content p-8 text-center">
            <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h4 class="font-bold text-gray-800 mb-2">溫馨提示</h4>
            <p id="warning-text" class="text-sm text-gray-500 mb-6 leading-relaxed"></p>
            <button id="close-warning" class="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm hover:bg-gray-200 transition-colors">我知道了</button>
        </div>
    </div>

    <!-- ===================================================================== -->
    <script>
        // ==================== 【HEADER 頂部輪播圖網址設定區】 ====================
        const CAROUSEL_IMAGES = [
            "https://github.com/manmangoshop/systemheader/blob/main/header260901.png?raw=true",
            "https://github.com/manmangoshop/systemheader/blob/main/header-product.png?raw=true",
            "https://github.com/manmangoshop/systemheader/blob/main/header-pi.png?raw=true"
        ];
        // =====================================================================

        // ================= 優惠活動自動滿額折開關 =================
        const ENABLE_AUTO_TIER_DISCOUNT = true; 

        function getAutoTierDiscount(amount) {
            if (!ENABLE_AUTO_TIER_DISCOUNT) return 0;
            if (amount >= 10000) return 1000;
            if (amount >= 8000) return 800;
            if (amount >= 6000) return 600;
            if (amount >= 4000) return 400;
            if (amount >= 2000) return 200;
            if (amount >= 1000) return 80;
            return 0;

        window.showLightbox = (imgUrl) => {
            if (!imgUrl) return;
            const overlay = document.getElementById('lightbox-overlay');
            const img = document.getElementById('lightbox-img');
            img.src = imgUrl;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                img.classList.remove('scale-95');
            }, 10);
        };

        window.hideLightbox = () => {
            const overlay = document.getElementById('lightbox-overlay');
            const img = document.getElementById('lightbox-img');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            img.classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
                img.src = "";
            }, 300);
        };

        // ================= 一鍵滾動定位函式 =================
        window.scrollToId = (id) => {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            } else if (id === 'top') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        async function fetchStock() {
            try {
                const response = await fetch(GAS_URL, { method: 'GET', cache: 'no-cache' });
                const data = await response.json();
                if (data) {
                    currentStock = data.stocks || {};
                    systemStatus = (data.systemStatus || "OPEN").toUpperCase();
                }
            } catch (e) {
                console.error("同步失敗:", e);
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        async function init() {
            await fetchStock();
            document.getElementById('loading-spinner').classList.add('hidden');
            
            if (systemStatus === "CLOSED") {
                document.getElementById('system-closed-message').classList.remove('hidden');
                document.getElementById('footer-bar').classList.add('hidden');
                document.getElementById('form-section').classList.add('hidden');
                document.getElementById('product-container').classList.add('hidden');
                return;
            }

            productContainer.classList.remove('hidden');
            document.getElementById('form-section').classList.remove('hidden');
            renderProducts();
            attachListeners();
            calculateTotal();
            
            // 啟動 Header 圖片輪播功能
            initHeaderCarousel();
        }

        // ==================== 【HEADER 輪播圖 執行邏輯】 ====================
        let currentSlideIndex = 0;
        let carouselInterval;
        let touchStartX = 0;
        let touchEndX = 0;

        function initHeaderCarousel() {
            const track = document.getElementById('header-carousel-track');
            const dotsContainer = document.getElementById('header-carousel-dots');
            if (!track || !dotsContainer) return;

            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            CAROUSEL_IMAGES.forEach((imgUrl, idx) => {
                const slide = document.createElement('div');
                slide.className = `carousel-slide ${idx === 0 ? 'active' : ''}`;
                
                const displayUrl = imgUrl || "https://placehold.co/1200x800/7494A1/ffffff?text=MANMANGO+SHOP";
                slide.innerHTML = `
                    <img src="${displayUrl}" class="w-full h-full object-cover transition-transform duration-[10s] hover:scale-105" alt="滿滿菓精選海報 ${idx + 1}" onerror="this.src='https://placehold.co/1200x800/7494a1/ffffff?text=Manmango+Shop'">
                `;
                track.appendChild(slide);

                const dot = document.createElement('button');
                dot.type = "button";
                dot.className = `dot ${idx === 0 ? 'active' : ''}`;
                dot.setAttribute('aria-label', `導向第 ${idx + 1} 張圖`);
                dot.onclick = () => goToSlide(idx);
                dotsContainer.appendChild(dot);
            });

            track.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            track.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            startAutoplay();
        }

        function startAutoplay() {
            stopAutoplay();
            if (CAROUSEL_IMAGES.length <= 1) return;
            carouselInterval = setInterval(() => {
                const nextIndex = (currentSlideIndex + 1) % CAROUSEL_IMAGES.length;
                goToSlide(nextIndex);
            }, 3000); 
        }

        function stopAutoplay() {
            if (carouselInterval) clearInterval(carouselInterval);
        }

        function goToSlide(index) {
            currentSlideIndex = index;
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach((slide, idx) => {
                if (idx === index) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            dots.forEach((dot, idx) => {
                if (idx === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            startAutoplay();
        }

        function handleSwipe() {
            const threshold = 50; 
            if (CAROUSEL_IMAGES.length <= 1) return;
            
            if (touchEndX < touchStartX - threshold) {
                const next = (currentSlideIndex + 1) % CAROUSEL_IMAGES.length;
                goToSlide(next);
            } else if (touchEndX > touchStartX + threshold) {
                const prev = (currentSlideIndex - 1 + CAROUSEL_IMAGES.length) % CAROUSEL_IMAGES.length;
                goToSlide(prev);
            }
        }

        window.updateQty = (id, delta) => {
            const currentVal = cart[id] || 0;
            const stock = currentStock[id] || 0;
            const next = Math.max(0, Math.min(stock, currentVal + delta)); 
            if (cart[id] !== next) { 
                cart[id] = next; 
                const inputEl = document.getElementById(`qty-${id}`);
                if (inputEl) inputEl.value = next; 
                calculateTotal(); 
            }
        };

        window.handleManualQtyChange = (inputEl, id) => {
            let val = parseInt(inputEl.value);
            const stock = currentStock[id] || 0;
            
            if (isNaN(val) || val < 0) {
                val = 0;
            }
            
            if (val > stock) {
                showWarning(`「${getProductBrandAndName(id)}」目前最多僅能預購 ${stock} 盒喔！`);
                val = stock;

            cart[id] = val;

        function getProductBrandAndName(id) {
            for (let g of productsData) {
                for (let i of g.items) {

                    }
                }
            }
            return "商品";
        }

        function calculateCalculations() {
            let subtotal = 0, items = [], hasChefMarket = false;
            productsData.forEach(g => g.items.forEach(i => {
                if (cart[i.id] > 0) {
                    subtotal += i.price * cart[i.id];
                    items.push({ ...i, qty: cart[i.id], brand: g.brand.trim() });
                    if (g.brand.trim() === "主廚市集") hasChefMarket = true;
                }
            }));
            const isTax = document.getElementById('tax-toggle').checked;
            const taxFactor = isTax ? 1.05 : 1;
            const note = document.getElementById('note').value.trim();
            let promoCount = 0, promoSubtotal = 0;
            items.forEach(item => { if (promoBrands.some(pb => item.brand.includes(pb.trim()))) { promoCount += item.qty; promoSubtotal += item.price * item.qty; }});
            
            const candidates = [];
            if (note.includes("WinWin2026")) candidates.push({ name: "VIP 92折", deduct: Math.round(subtotal * taxFactor * 0.08), rate: 0.92, fixed: 0 });
            if (note.includes("wqasdqeasd")) candidates.push({ name: "菓友 95折", deduct: Math.round(subtotal * taxFactor * 0.05), rate: 0.95, fixed: 0 });
            if (promoCount >= 2) candidates.push({ name: "品牌聯慶 95折", deduct: Math.round(promoSubtotal * taxFactor * 0.05), rate: 1, fixed: Math.round(promoSubtotal * taxFactor * 0.05) });
            if (note.includes("MMG2026") && subtotal >= 1500) candidates.push({ name: "菓友滿額折$100", deduct: 100, rate: 1, fixed: 100 });
            else if (note.includes("eqeadqweeqe") && subtotal >= 888) candidates.push({ name: "滿額折$88", deduct: 88, rate: 1, fixed: 88 });

            candidates.sort((a, b) => b.deduct - a.deduct);
            const best = candidates.length > 0 ? candidates[0] : { name: "無", rate: 1, fixed: 0 };
            
            let tempProductAmount = Math.max(0, Math.round(subtotal * taxFactor * best.rate) - best.fixed);
            
            const autoDeduct = getAutoTierDiscount(subtotal);
            const finalProductAmount = Math.max(0, tempProductAmount - autoDeduct);
            
            const method = document.getElementById('shippingMethod').value;
            let shippingFee = 0;
            if (subtotal > 0 && !hasChefMarket) {
                if (method === "超商取貨") shippingFee = finalProductAmount >= 1500 ? 0 : 60;
                else if (method === "宅配到府") shippingFee = finalProductAmount >= 3000 ? 0 : 210;
            }
            return { 
                subtotal, 
                items, 
                isTax, 
                discountName: best.name, 
                promoDeduct: best.deduct || best.fixed || 0, 
                autoDeduct, 
                shippingFee, 
                finalProductAmount, 
                total: finalProductAmount + shippingFee, 
                hasChefMarket 
            };
        }

        function calculateTotal() {
            const res = calculateCalculations();
            document.getElementById('footer-total').innerText = res.total.toLocaleString();
            
            let hintText = "";
            if (res.discountName !== "無") {
                hintText += `已套用: ${res.discountName}`;
            }
            if (res.autoDeduct > 0) {
                hintText += (hintText ? " + " : "") + `活動滿額折 $${res.autoDeduct}`;
            }
            document.getElementById('discount-hint').innerText = hintText;
            
            const percent = Math.min((res.finalProductAmount / 3000) * 100, 100);
            progressBar.style.width = `${percent}%`;
            
            if (res.hasChefMarket) shippingMsg.innerText = "已達成！全單免運 🎉";
            else if (res.finalProductAmount >= 3000) shippingMsg.innerText = "已達成！宅配免運 🎉";
            else if (res.finalProductAmount >= 1500) shippingMsg.innerText = "已享超取免運";
            else {
                const target = document.getElementById('shippingMethod').value === "超商取貨" ? 1500 : 3000;
                shippingMsg.innerText = `再買 $${(target - res.finalProductAmount).toLocaleString()} 享免運`;
            }
        }

        async function submitOrder() {
            const confirmBtn = document.getElementById('confirm-submit-btn');
            const backBtn = document.getElementById('back-edit-btn');
            const closeBtn = document.getElementById('close-modal');
            
            confirmBtn.disabled = true; 
            confirmBtn.innerText = "正在傳送...";
            backBtn.disabled = true;
            backBtn.classList.add('opacity-30', 'cursor-not-allowed');
            closeBtn.classList.add('hidden'); 

            const res = calculateCalculations();
            const rawPhone = document.getElementById('phone').value.trim();
            const rawRecipientPhone = document.getElementById('recipientPhone').value.trim();
            const rawTaxId = document.getElementById('taxId').value.trim();
            
            // 組合完整折扣字串
            let completeDiscountText = "";
            if (res.discountName !== "無") {
                completeDiscountText += res.discountName;
            }
            if (res.autoDeduct > 0) {
                completeDiscountText += (completeDiscountText ? " + " : "") + `活動滿額折$${res.autoDeduct}`;
            }
            if (!completeDiscountText) {
                completeDiscountText = "無";
            }

            const orderData = { 
                name: document.getElementById('name').value, 
                recipientName: document.getElementById('recipientName').value,
                phone: rawPhone, 
                recipientPhone: rawRecipientPhone,
                email: document.getElementById('email').value.trim(), 
                line: document.getElementById('line').value, 
                shippingMethod: document.getElementById('shippingMethod').value, 
                address: document.getElementById('address').value, 
                total: res.total, 
                isTax: document.getElementById('tax-toggle').checked ? "是" : "否" 
            };

            const payload = { 
                ...orderData, 
                type: "submitOrder", 
                phone: "'" + rawPhone, 
                recipientPhone: "'" + rawRecipientPhone,
                taxId: rawTaxId ? "'" + rawTaxId : "", 
                detail: res.items.map(i => `${i.brand}-${i.name} (單價:${i.price}) x ${i.qty}`).join('\n'), 
                itemIds: res.items.map(i => i.id), 
                itemQtys: res.items.map(i => i.qty), 
                shippingFee: res.shippingFee, 
                discount: completeDiscountText, 
                note: document.getElementById('note').value, 
                orderTime: new Date().toLocaleString('zh-TW') 
            };

            try { 
                // 移除了 mode: 'no-cors'，以此獲得 Google Apps Script 正確回傳的最新遞增 orderId 封包
                const response = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                }); 
                const result = await response.json();
                
                if (result.status === "success") {
                    orderData.orderId = result.orderId; // 綁定後端生成的正確編號
                    showSuccess(orderData); 
                } else {
                    throw new Error(result.message || "後台核發編號失敗");
                }
            } catch (e) { 
                confirmBtn.disabled = false; 
                confirmBtn.innerText = "再次確認送出";
                backBtn.disabled = false; 
                backBtn.classList.remove('opacity-30', 'cursor-not-allowed');
                closeBtn.classList.remove('hidden');
                showWarning("網路傳輸不穩，請再次點擊發送確認。");
            }
        }

                    <div class="bg-red-50 border border-red-200 p-4 rounded-2xl text-[12px] text-red-800 leading-relaxed font-medium">
                        <p class="font-bold text-sm mb-1 text-red-600">⏱️ 預購名額僅保留 72 小時！</p>
                        系統已暫時為您受理申請。請於匯款完成後，<b>務必點擊下方綠色按鈕加入官方 LINE</b>，並傳送您的<b>「訂單編號」與「匯款後五碼」</b>。收到客服「對帳完成」回覆後，該筆訂單才算是正式完成訂購。
                    </div>

                    <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 text-[13px] space-y-2">
                        <div class="flex justify-between items-center border-b pb-2 mb-2">
                            <span class="text-gray-400">訂單編號</span>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-wagashi" id="success-order-id">${data.orderId}</span>
                                <button type="button" onclick="copyOrderId('${data.orderId}')" id="copy-btn" class="text-[10px] bg-wagashi/10 text-wagashi px-2.5 py-1 rounded-md font-bold transition-all">📋 複製</button>
                            </div>
                        </div>
                        <div class="flex justify-between"><span class="text-gray-400">訂購姓名</span><span>${data.name}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">收件姓名</span><span class="font-bold text-gray-800">${data.recipientName}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">收件電話</span><span>${data.recipientPhone}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">聯絡電話</span><span>${data.phone}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">配送方式</span><span>${data.shippingMethod}</span></div>
                        <div class="flex flex-col pt-1"><span class="text-gray-400 mb-1">收件地址</span><span class="break-words font-medium text-gray-700">${data.address}</span></div>
                        <div class="flex justify-between border-t border-gray-200 pt-3 mt-1"><span class="font-bold text-gray-800 text-sm">應付總額</span><span class="text-xl font-black text-wagashi">NT$ ${data.total.toLocaleString()}</span></div>
                    </div>
                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 space-y-3">
                        <h4 class="text-xs font-bold text-blue-600 mb-1 uppercase tracking-widest text-center">💰 匯款資訊</h4>
                        <div class="bg-white p-3 rounded-xl border border-blue-100 font-mono text-sm font-bold text-center">${bank}</div>
                        <ul class="text-[11px] text-blue-700 font-medium space-y-2 list-disc pl-4 leading-relaxed">
                            <li>訂單確認郵件已寄至您的電子信箱</li>
                            <li>請於三日內完成付款，逾期名額自動釋出</li>
                            <li>匯款完成後，請【複製訂單編號】前往 LINE 對帳</li>
                        </ul>
                    </div>
                    <div class="text-center space-y-4">
                        <a href="https://lin.ee/EZDBiB0" target="_blank" class="flex items-center justify-center gap-2 w-full py-4 bg-line text-white rounded-2xl font-bold text-sm shadow-lg active:scale-[0.98] transition-transform">💬 複製單號後點此加入 LINE 完成訂單</a>
                        <button id="final-home-btn" class="text-gray-300 text-xs font-bold hover:text-gray-600 pb-2">訂單已受理並回到首頁</button>
                    </div>
                </div>`;
            document.getElementById('final-home-btn').onclick = finishAndHome;
        }

        async function finishAndHome() {
            toggleModal(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('product-container').classList.add('hidden');
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('loading-spinner').classList.remove('hidden');
            for (let key in cart) cart[key] = 0;
            document.getElementById('order-form-el').reset();
            document.getElementById('tax-input-group').classList.add('hidden');
            
            const confirmBtn = document.getElementById('confirm-submit-btn');
            const backBtn = document.getElementById('back-edit-btn');
            const modalFooter = document.getElementById('modal-footer-btns');
            confirmBtn.disabled = false; 
            confirmBtn.innerText = "確認送出";
            backBtn.disabled = false;
            backBtn.classList.remove('opacity-30', 'cursor-not-allowed');
            modalFooter.classList.remove('hidden');
            document.getElementById('close-modal').classList.remove('hidden'); 
            
            await fetchStock();
            renderProducts();
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('product-container').classList.remove('hidden');
            document.getElementById('form-section').classList.remove('hidden');
            calculateTotal();
            
            initHeaderCarousel();
        }

        window.onload = init;
    </script>
</body>
</html>
